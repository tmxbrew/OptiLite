name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: PSScriptAnalyzer + encoding checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse and lint OptiLite.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Errores de analisis: fallo. Advertencias: solo informe.
          $results = Invoke-ScriptAnalyzer -Path .\OptiLite.ps1 -Severity Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message | Out-String -Width 220 | Write-Host
          } else {
            Write-Host 'PSScriptAnalyzer: sin hallazgos.'
          }
          if ($results | Where-Object { $_.Severity -eq 'Error' }) {
            Write-Error 'PSScriptAnalyzer encontro errores; revisa el informe de arriba.'
            exit 1
          }

      - name: Check encoding (UTF-8 BOM + CRLF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [System.IO.File]::ReadAllBytes('OptiLite.ps1')
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
            throw 'OptiLite.ps1 debe empezar con un BOM UTF-8 (acentos del espanol).'
          }
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $bareLf = [regex]::Matches($text, '(?<!\r)\n').Count
          if ($bareLf -gt 0) {
            throw "OptiLite.ps1 debe usar CRLF en todas las lineas ($bareLf LF sueltos)."
          }
          Write-Host 'Codificacion correcta: UTF-8 BOM + CRLF.'
